name: Build Linux binary

# The installer logic is Linux/XDG-specific (.desktop launchers), so we only
# ship a Linux binary. Tag a version (git tag v0.1.0 && git push --tags) and
# the binary is attached to the GitHub Release automatically.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libs
        run: >
          sudo apt-get update &&
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: pip install PySide6 PyInstaller

      - name: Build one-file binary
        run: pyinstaller --onefile --name webapp-maker main.py

      - name: Smoke test
        run: |
          test "$(./dist/webapp-maker --name github.com)" = "GitHub"
          ./dist/webapp-maker --install example.com
          test -f ~/.local/share/applications/webapp-example-com.desktop
          ./dist/webapp-maker --delete example.com

      - name: Test installer
        run: |
          cp dist/webapp-maker ./webapp-maker
          ./install.sh
          test -f ~/.local/share/applications/webapp-maker.desktop
          test -x ~/.local/bin/webapp-maker
          ./install.sh --uninstall
          test ! -f ~/.local/share/applications/webapp-maker.desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-maker-linux
          path: |
            dist/webapp-maker
            install.sh
            icon.svg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/webapp-maker
            install.sh
            icon.svg
